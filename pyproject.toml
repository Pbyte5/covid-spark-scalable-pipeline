[project]
name = "covid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PByte", email = "paterninalopezlians@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyspark==4.3.0",
]

[project.scripts]
covid = "covid:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "AIR"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
